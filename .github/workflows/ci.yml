name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew --no-daemon :core:testDebugUnitTest assembleRelease
      # One library per player family: it must still compile against the oldest supported versions.
      - run: ./gradlew --no-daemon -Pmedia3=1.0.0 -Pexoplayer2=2.16.1 :media3:compileReleaseKotlin :exoplayer2:compileReleaseKotlin
      - run: ./gradlew --no-daemon -Pexoplayer2=amazon :exoplayer2:compileReleaseKotlin

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: swift test
      - run: xcodebuild -scheme UnifiedPlayData-Package -destination 'generic/platform=iOS Simulator' build
      - run: xcodebuild -scheme UnifiedPlayData-Package -destination 'generic/platform=tvOS Simulator' build
